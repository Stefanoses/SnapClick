name: Release

# Builds standalone bundles for Windows and Linux and attaches them to a
# GitHub Release. Triggered by pushing a tag like v1.0.0 (see
# scripts/release.py).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:      # manual re-run from the Actions tab (no re-tagging)

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Install system deps (Linux: Qt runtime libs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Run tests
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || 'windows' }}
        run: python -m pytest tests -q

      - name: Build bundle (Windows)
        if: matrix.artifact == 'windows'
        run: cmd /c scripts\build_windows.bat

      - name: Build bundle (Linux)
        if: matrix.artifact == 'linux'
        run: bash scripts/build_linux.sh

      - name: Package artifact
        run: python scripts/package_artifact.py

      - uses: actions/upload-artifact@v4
        with:
          name: snapclick-${{ matrix.artifact }}
          path: dist/SnapClick-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: snapclick-*
          merge-multiple: true
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
